<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="0.55" stop-color="#4f46e5"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity="0.04"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- 底板：渐变圆角方块 -->
  <rect width="64" height="64" rx="14" fill="url(#bg)"/>
  <rect width="64" height="64" rx="14" fill="url(#sheen)"/>
  <!-- 声波脉冲（语音质检） -->
  <g fill="#ffffff">
    <rect x="13" y="25" width="4.6" height="14" rx="2.3"/>
    <rect x="21" y="19" width="4.6" height="26" rx="2.3"/>
    <rect x="29" y="13" width="4.6" height="38" rx="2.3"/>
    <rect x="37" y="19" width="4.6" height="26" rx="2.3"/>
    <rect x="45" y="25" width="4.6" height="14" rx="2.3"/>
  </g>
  <!-- AI 信号节点 -->
  <circle cx="50" cy="15" r="3.2" fill="#ffffff"/>
  <circle cx="50" cy="15" r="6.5" fill="none" stroke="#ffffff" stroke-opacity="0.45" stroke-width="1.6"/>
</svg>
