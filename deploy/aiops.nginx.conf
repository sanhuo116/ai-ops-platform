# Include inside the spagent.indata.cc:5173 server block.
location = /aiops {
    return 308 /aiops/$is_args$args;
}
location ^~ /aiops/ {
    proxy_pass http://127.0.0.1:8787;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 300m;
    proxy_read_timeout 20m;
    proxy_send_timeout 20m;
}
# GovAide sets an HttpOnly cookie with Path=/ga. Only this exact callback needs it.
location = /ga/aiops-entry {
    proxy_pass http://127.0.0.1:8787;
    proxy_set_header Host $http_host;
    proxy_set_header X-Forwarded-Proto $scheme;
    access_log off;
}
